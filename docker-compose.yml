version: "3.9"

# ---------------------------------------------------------------------------
# Zenith — docker-compose development / staging stack
#
# Profiles:
#   (default)  — frontend only, mock mode enabled (no backend required)
#   full       — frontend + backend API + internal services (indexer, scheduler, keeper)
#   fork       — mainnet-state fork + chaos-testing environment (issue #228)
#
# Quick start:
#   docker compose up                     # mock mode, frontend only
#   docker compose --profile full up      # with real backend
#   docker compose --profile fork up      # fork + chaos harness (see scripts/fork/README.md)
#
# Runtime overrides (copy .env.compose.example to .env.compose and edit):
#   ZENITH_BACKEND_IMAGE   backend image tag (default: ghcr.io/zenith-options/backend:latest)
#   ZENITH_FRONTEND_IMAGE  frontend image tag (default: ghcr.io/zenith-options/frontend:latest)
#
# Trust boundaries (see docs/network-surfaces.md):
#   - Only `frontend` (BFF) and `backend` (API) publish host ports.
#   - `indexer`, `scheduler`, `keeper` live on the internal `vault-internal`
#     network only and are NOT publicly routable.
#   - Service-to-service calls use short-lived signed service tokens
#     (SERVICE_TOKEN_*) sourced from a managed secret store; no static
#     bearer secrets are inlined here.
#   - Outbound egress is restricted to the allowlist in `vault-egress`.
# ---------------------------------------------------------------------------

services:
  frontend:
    image: ${ZENITH_FRONTEND_IMAGE:-ghcr.io/zenith-options/frontend:latest}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8081}
        NEXT_PUBLIC_NETWORK: ${NEXT_PUBLIC_NETWORK:-testnet}
    ports:
      - "3000:3000"
    environment:
      # Runtime values — override at startup without rebuilding the image.
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://backend:8081}
      NEXT_PUBLIC_RPC_URL: ${NEXT_PUBLIC_RPC_URL:-https://soroban-testnet.stellar.org}
      NEXT_PUBLIC_NETWORK: ${NEXT_PUBLIC_NETWORK:-testnet}
      NEXT_PUBLIC_CONTRACT_ID: ${NEXT_PUBLIC_CONTRACT_ID:-}
      MOCK_MODE: ${MOCK_MODE:-true}
      # Service identity for outbound calls to the API (short-lived, rotated).
      SERVICE_TOKEN_ISSUER: ${SERVICE_TOKEN_ISSUER:-}
      SERVICE_TOKEN_AUDIENCE: ${SERVICE_TOKEN_AUDIENCE:-backend}
      SERVICE_TOKEN_SCOPE: ${SERVICE_TOKEN_SCOPE:-bff:read}
    networks:
      - vault-public
      - vault-internal
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  backend:
    profiles: ["full"]
    image: ${ZENITH_BACKEND_IMAGE:-ghcr.io/zenith-options/backend:latest}
    ports:
      - "8081:8081"
    environment:
      RUST_LOG: ${RUST_LOG:-info}
      # Verifies inbound service tokens; signing keys come from the managed store.
      SERVICE_TOKEN_ISSUER: ${SERVICE_TOKEN_ISSUER:-}
      SERVICE_TOKEN_AUDIENCE: ${SERVICE_TOKEN_AUDIENCE:-backend}
      SERVICE_TOKEN_CLOCK_SKEW_SECS: ${SERVICE_TOKEN_CLOCK_SKEW_SECS:-30}
    networks:
      - vault-public
      - vault-internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # -------------------------------------------------------------------------
  # Internal services — no published ports, internal network only.
  # Each carries a narrow scope claim; least-privilege by construction.
  # -------------------------------------------------------------------------
  indexer:
    profiles: ["full"]
    image: ${ZENITH_BACKEND_IMAGE:-ghcr.io/zenith-options/backend:latest}
    command: ["indexer"]
    environment:
      RUST_LOG: ${RUST_LOG:-info}
      SERVICE_TOKEN_ISSUER: ${SERVICE_TOKEN_ISSUER:-}
      SERVICE_TOKEN_AUDIENCE: ${SERVICE_TOKEN_AUDIENCE:-backend}
      # Read-only: cannot submit transactions.
      SERVICE_TOKEN_SCOPE: ${INDEXER_SERVICE_TOKEN_SCOPE:-indexer:read}
      SERVICE_TOKEN_CLOCK_SKEW_SECS: ${SERVICE_TOKEN_CLOCK_SKEW_SECS:-30}
    networks:
      - vault-internal
      - vault-egress
    restart: unless-stopped

  scheduler:
    profiles: ["full"]
    image: ${ZENITH_BACKEND_IMAGE:-ghcr.io/zenith-options/backend:latest}
    command: ["scheduler"]
    environment:
      RUST_LOG: ${RUST_LOG:-info}
      SERVICE_TOKEN_ISSUER: ${SERVICE_TOKEN_ISSUER:-}
      SERVICE_TOKEN_AUDIENCE: ${SERVICE_TOKEN_AUDIENCE:-backend}
      SERVICE_TOKEN_SCOPE: ${SCHEDULER_SERVICE_TOKEN_SCOPE:-scheduler:epoch}
      SERVICE_TOKEN_CLOCK_SKEW_SECS: ${SERVICE_TOKEN_CLOCK_SKEW_SECS:-30}
    networks:
      - vault-internal
      - vault-egress
    restart: unless-stopped

  keeper:
    profiles: ["full"]
    image: ${ZENITH_BACKEND_IMAGE:-ghcr.io/zenith-options/backend:latest}
    command: ["keeper"]
    environment:
      RUST_LOG: ${RUST_LOG:-info}
      SERVICE_TOKEN_ISSUER: ${SERVICE_TOKEN_ISSUER:-}
      SERVICE_TOKEN_AUDIENCE: ${SERVICE_TOKEN_AUDIENCE:-backend}
      # Keeper must not read depositor PII; scope excludes pii:read.
      SERVICE_TOKEN_SCOPE: ${KEEPER_SERVICE_TOKEN_SCOPE:-keeper:settle}
      SERVICE_TOKEN_CLOCK_SKEW_SECS: ${SERVICE_TOKEN_CLOCK_SKEW_SECS:-30}
    networks:
      - vault-internal
      - vault-egress
    restart: unless-stopped

  # -------------------------------------------------------------------------
  # Fork + chaos environment (issue #228).
  #
  # Two-stage design so a snapshot can be pinned and shared:
  #   1. `snapshot` captures public ledger state at a chosen sequence into a
  #      named volume (no secrets — only public ledger data).
  #   2. `fork-rpc` boots a local Soroban RPC that serves that snapshot, and
  #      `chaos-runner` deploys the compiled vault suite against it and runs
  #      the scripted chaos scenarios with fault injection at the RPC boundary.
  #
  # Determinism: SNAPSHOT_SEED drives both the fault schedule and the ledger
  # timestamps used for epoch boundaries, so the same snapshot + seed yields
  # the same scenario outcome. The RPC is bound to localhost only and refuses
  # to start if FORK_RPC_URL points at a public/production endpoint.
  # -------------------------------------------------------------------------
  snapshot:
    profiles: ["fork"]
    image: ${ZENITH_FORK_IMAGE:-ghcr.io/zenith-options/fork-tooling:latest}
    build:
      context: .
      dockerfile: scripts/fork/Dockerfile
    command: ["snapshot", "capture"]
    environment:
      SNAPSHOT_LEDGER_SEQ: ${SNAPSHOT_LEDGER_SEQ:-0}
      SNAPSHOT_OUT: /snapshots
      # Public read-only source; never a signing key.
      SNAPSHOT_SOURCE_RPC: ${SNAPSHOT_SOURCE_RPC:-https://soroban-testnet.stellar.org}
    volumes:
      - fork-snapshots:/snapshots
    restart: "no"

  fork-rpc:
    profiles: ["fork"]
    image: ${ZENITH_FORK_IMAGE:-ghcr.io/zenith-options/fork-tooling:latest}
    build:
      context: .
      dockerfile: scripts/fork/Dockerfile
    command: ["rpc", "serve"]
    depends_on:
      snapshot:
        condition: service_completed_successfully
    environment:
      SNAPSHOT_IN: /snapshots
      SNAPSHOT_SEED: ${SNAPSHOT_SEED:-1}
      FORK_RPC_BIND: 0.0.0.0:8000
      # Guard: the harness refuses to run against a non-local RPC.
      FORK_RPC_ALLOW_REMOTE: "false"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - fork-snapshots:/snapshots
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  chaos-runner:
    profiles: ["fork"]
    image: ${ZENITH_FORK_IMAGE:-ghcr.io/zenith-options/fork-tooling:latest}
    build:
      context: .
      dockerfile: scripts/fork/Dockerfile
    command: ["chaos", "run"]
    depends_on:
      fork-rpc:
        condition: service_healthy
    environment:
      FORK_RPC_URL: http://fork-rpc:8000
      SNAPSHOT_SEED: ${SNAPSHOT_SEED:-1}
      CHAOS_SCENARIOS: ${CHAOS_SCENARIOS:-all}
      CHAOS_REPORT_DIR: /reports
    volumes:
      - fork-reports:/reports
    restart: "no"

# ---------------------------------------------------------------------------
# Networks encode the trust boundaries:
#   vault-public   — externally reachable (BFF + API only)
#   vault-internal — service-to-service only, not routable from host
#   vault-egress   — outbound allowlist (Stellar RPC, Horizon, price feeds,
#                    notification providers); denied egress is logged/alerted
# ---------------------------------------------------------------------------
networks:
  vault-public:
    driver: bridge
  vault-internal:
    driver: bridge
    internal: true
  vault-egress:
    driver: bridge

volumes:
  fork-snapshots:
  fork-reports:
